services:
  postgres:
    image: postgres:16-alpine
    container_name: barber_paradise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barber_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barber_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-barber_paradise_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
